services:
  simdive:
    image: node:${NODE_VERSION}-alpine
    container_name: simdive
    ports:
      - '127.0.0.1:5173:5173'
    init: true
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    working_dir: /var/www/simdive/web
    volumes:
      - .:/var/www/simdive
    environment:
      - NODE_ENV=development
