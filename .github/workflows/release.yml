name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Queue runs instead of running them in parallel, so that close merges on main
# do not race on the release PR. Never cancel a run that may be tagging.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create release PR or GitHub release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          # A PAT (or GitHub App token) is required so that the release PR
          # triggers the CI workflow; GITHUB_TOKEN-created PRs do not.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
